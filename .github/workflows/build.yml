name: Build und Tests

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Toolchain installieren
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi cmake

      - name: Host-Tests (Kernmodule)
        run: |
          cmake -S tests -B build-tests
          cmake --build build-tests
          ./build-tests/test_core

      - name: Tests der Auswertung (Python)
        run: |
          pip install -r tools/analysis/requirements.txt
          python tools/analysis/test_fc_analysis.py

      - name: Firmware bauen
        run: |
          cmake -S . -B build
          cmake --build build

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/firmware.hex
            build/firmware.bin
